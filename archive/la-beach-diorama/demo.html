<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LA beach diorama — archived demo</title>
  <meta name="robots" content="noindex" />
  <style>
    /* The subset of the site's stylesheet the widget needs, frozen with it. */
    :root {
      --corner-inset: clamp(16px, 4vw, 40px);
      --bg: #ffffff;
      --accent: #b4552d;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html, body { margin: 0; min-height: 100vh; background: var(--bg); }
    .note {
      max-width: 30rem;
      margin: 18vh auto 0;
      padding: 0 24px;
      font: 15px/1.7 Georgia, serif;
      color: #6b6459;
      text-align: center;
    }
    .note code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .scene {
      position: fixed;
      right: var(--corner-inset);
      bottom: calc(var(--corner-inset) + 30px);
      width: 100px;
      height: 100px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(23, 21, 15, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.10);
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transform: translateY(6px) scale(0.98);
      transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
    }
    .scene.is-ready { opacity: 1; transform: none; }
    .scene__cv {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .scene.is-interactive { pointer-events: auto; cursor: pointer; }
    .scene.is-interactive:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .scene.is-expanded {
      position: fixed;
      top: 50%;
      left: 50%;
      right: auto;
      bottom: auto;
      width: var(--exp-size, 100px);
      height: var(--exp-size, 100px);
      margin-top: calc(-1 * var(--exp-size, 100px) / 2);
      margin-left: calc(-1 * var(--exp-size, 100px) / 2);
      border-radius: calc(var(--exp-size, 100px) / 12);
      box-shadow: 0 18px 60px rgba(23, 21, 15, 0.30), inset 0 0 0 1px rgba(255, 255, 255, 0.10);
      z-index: 91;
    }
    .scene-backdrop {
      position: fixed;
      inset: 0;
      background: var(--bg);
      opacity: 0;
      z-index: 90;
      pointer-events: none;
      transition: opacity 0.5s var(--ease-out);
    }
    .scene-backdrop.is-on { opacity: 1; pointer-events: auto; cursor: pointer; }
    html.scene-lock { overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      .scene { transition: none; transform: none; opacity: 1; }
      .scene-backdrop { transition: none; }
    }
  </style>
</head>
<body>
  <p class="note">
    The original living pixel-art <strong>LA beach diorama</strong> — archived, exactly as it
    last shipped (site v1.12.3). It mounts itself in the corner below, driven by real
    Los Angeles time and weather. <strong>Click it</strong> to zoom.
    <br /><br />
    Superseded by <code>weather-vivarium</code> on npm — see <code>README.md</code>.
  </p>
  <script src="scene.js" defer></script>
</body>
</html>
